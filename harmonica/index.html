<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>口琴大师</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 顶部 -->
  <header class="app-header">
    <h1>🎵 口琴大师</h1>
    <div class="header-btns">
      <select id="harmonicaSelect"></select>
      <button id="btnRec" class="btn-rec">⏺</button>
      <button id="btnRecStop" class="btn-rec-stop hidden">■</button>
    </div>
  </header>

  <!-- 上半：口琴谱 -->
  <section class="top-half">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 搜索歌曲...">
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </section>

  <!-- 自动演奏控制条（选歌后显示） -->
  <section class="playback-bar hidden" id="playbackBar">
    <div class="pb-title" id="playbackTitle">小星星</div>
    <button id="btnPlay" class="btn-play">▶</button>
    <button id="btnStop" class="btn-stop">■</button>
    <span id="speedLabel" class="spd">1.0x</span>
    <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="spd-slider">
  </section>

  <!-- 下半：24孔按钮 -->
  <section class="bottom-half">
    <div class="hole-grid" id="harmonicaBody"></div>
    <div class="bottom-toolbar">
      <span class="hint"><span class="d blow"></span>吹 <span class="d draw"></span>吸 长按持续发声</span>
      <button id="btnAddSong" class="btn-add">+ 加谱</button>
    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<!-- 添加琴谱弹窗 -->
<div id="addModal" class="modal hidden">
  <div class="modal-content">
    <h3>添加琴谱</h3>
    <input type="text" id="mTitle" placeholder="歌曲名">
    <textarea id="mNotes" placeholder="1 2 3 4 5 6 7&#10;^高八度 _低八度 -延长"></textarea>
    <div class="modal-btns">
      <button id="mCancel">取消</button>
      <button id="mSave">保存</button>
    </div>
  </div>
</div>

<script src="harmonicas.js"></script>
<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
